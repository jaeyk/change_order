<text x="24.0" y="36.0" font-size="18" fill="#15191c" text-anchor="start" font-weight="bold">Figure 2. Who buys off whose contract (contract counts)</text>
<text x="24.0" y="60.0" font-size="13" fill="#4d5458" text-anchor="start" font-weight="normal">Vertical piggybacking 1,621 (62% of cooperative contracts); horizontal pooling 731 (28%); central purchasing 4,441 shown dotted.</text>
